[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
sixlauncher-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["native-certs"] }
toml = "0.8"
roxmltree = "0.20"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
