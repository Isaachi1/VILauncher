[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vilauncher"
version = "0.1.0"
description = "Linux launcher for VIctory (VILinux) and XCL (LinuxCL): runs an Xbox Series title you own through Wine or Proton with vkd3d-proton"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vilauncher = "vilauncher.cli:main"

[tool.setuptools]
packages = ["vilauncher"]
