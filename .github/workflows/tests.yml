name: tests

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Windows: the window and the CLI build there and pass clippy (the unit tests drive Linux's
  # Proton and Wine with shell scripts, so they run in the job above).
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --locked -- -D warnings

  # The window's translations: every language has every key with the same {placeholders},
  # and every key the page uses exists (ui/locales, scripts/check-locales.js).
  locales:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-locales.js
