# Builds SixLauncher and packs it for Linux:
#
# * launcher: SixLauncher itself on Linux (the `sixlauncher` CLI, the Tauri window, .deb, .rpm,
#             AppImage)
# * flatpak:  SixLauncher as a Flatpak bundle (packaging/flatpak), for the Steam Deck and any distro
# * bundle:   one tarball with the CLI and the window
# * macos:    SixLauncher for macOS on Apple Silicon (.dmg with the app, and the CLI)
# * windows:  SixLauncher for Windows x64 (an installer, and a .zip with the window and the CLI);
#             there VIctory and XCL run natively, without Proton or Wine
#
# VIctory and XCL are not built here: SixLauncher/builder (on Railway) builds, every
# 3 hours, each public VIctory / XCL tree scoring 59% or more on PortWatch VI, scans it on
# VirusTotal and publishes it on its own `runtimes` release, where the launcher installs it from
# (crates/core/src/update.rs).
#
# Runs on pushes to main, on pull requests and by hand (Actions > build > Run workflow).
# Every push to main (a merged PR) publishes the files as a GitHub release, versioned
# <major>.<minor>.<run number> from Cargo.toml's workspace version (job `version`); a `v*` tag
# pushed by hand publishes one under that tag.
#
# Self-update: each release carries latest.json (Tauri updater format). The window reads it from
# the latest release; an AppImage, .deb, .rpm or the Windows installer's copy installs the new
# version by itself when the release is signed. The public key is in app/tauri.conf.json (plugins.updater.pubkey); signing
# needs, in Settings > Secrets and variables > Actions:
#   secret   TAURI_SIGNING_PRIVATE_KEY           the matching private key
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   variable TAURI_UPDATER_PUBKEY                optional: replaces the public key in the build
# Without the secrets the packages are built unsigned and the window only says a new version
# exists. (The Windows installer is signed for the updater only, not with an Authenticode
# certificate: SmartScreen warns on the first run, "More info > Run anyway".) Losing the private key means installed copies refuse every later update.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A PR's new push cancels its older run; every push to main runs to the end, since each one
# publishes its own release.
concurrency:
  group: build-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The version the packages carry and the release is published under. On a push to main:
  # Cargo.toml's <major>.<minor> and this workflow's run number as the patch, so it is unique and
  # grows with every merge without anyone tagging; bump the workspace version in Cargo.toml for a
  # new minor or major. On a `v*` tag: the tag. Otherwise: Cargo.toml's version as it is.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          set -euo pipefail
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          [[ $base =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || { echo "::error::workspace version '$base' is not x.y.z"; exit 1; }
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}; release=true
          elif [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$GITHUB_RUN_NUMBER"; release=true
          else
            version=$base; release=false
          fi
          echo "version $version, release $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  launcher:
    name: SixLauncher (Linux)
    needs: version
    # The oldest supported runner, so the AppImage and the binaries run on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The window and the package names and metadata take the version from tauri.conf.json.
      - name: Version ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s/^(  \"version\": )\"[^\"]*\"/\1\"$VERSION\"/" app/tauri.conf.json
          grep -n '"version"' app/tauri.conf.json

      # The updater's public key goes into the window (it checks every update against it), and
      # with the private key at hand the AppImage, .deb and .rpm get a .sig each.
      # The secret must hold the whole key file `cargo tauri signer generate` wrote (one base64
      # line). Whitespace and line breaks a paste adds are dropped; a key that still does not
      # decode is reported and the packages are built unsigned instead of failing the build at
      # the very end ("failed to decode secret key ... Invalid padding").
      - name: Updater keys
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          conf=app/tauri.conf.json
          if [ -n "$PUBKEY" ]; then
            jq --arg k "$PUBKEY" '.plugins.updater.pubkey = $k' "$conf" > conf.tmp && mv conf.tmp "$conf"
            echo "updater public key replaced by the TAURI_UPDATER_PUBKEY variable"
          fi
          key=$(printf '%s' "$PRIVATE_KEY" | tr -d '[:space:]')
          if [ -z "$key" ]; then
            echo "::notice::no TAURI_SIGNING_PRIVATE_KEY secret: the packages are not signed for the updater"
          elif ! decoded=$(printf '%s' "$key" | base64 -d 2>/dev/null) || [ -z "$decoded" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not valid base64 (truncated or not the key file's content); the packages are built unsigned. Paste the whole file from 'cargo tauri signer generate' into the secret."
          else
            jq '.bundle.createUpdaterArtifacts = true' "$conf" > conf.tmp && mv conf.tmp "$conf"
            echo "::add-mask::$key"
            echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
            if [ -n "$PRIVATE_KEY_PASSWORD" ]; then
              {
                echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<SIXLAUNCHER_EOF"
                printf '%s\n' "$PRIVATE_KEY_PASSWORD"
                echo "SIXLAUNCHER_EOF"
              } >> "$GITHUB_ENV"
            fi
            echo "the packages will be signed"
          fi

      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config patchelf file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Upgraded when a newer 2.x exists (the cache keeps the old one otherwise): signing the
      # .deb and .rpm for the updater needs a recent bundler.
      - name: Tauri CLI
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri --version

      - name: Build the CLI
        run: cargo build --release --locked -p sixlauncher-cli

      - name: Build the window, .deb and AppImage
        working-directory: app
        env:
          # linuxdeploy is an AppImage itself; the runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) come from the Updater keys step, only when valid.
        run: cargo tauri build

      - name: Collect
        run: |
          mkdir -p out
          cp target/release/sixlauncher target/release/sixlauncher-app out/
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage out/
          # The updater signatures, when the build was signed.
          shopt -s nullglob
          sigs=(target/release/bundle/{deb,rpm,appimage}/*.sig)
          if [ ${#sigs[@]} -gt 0 ]; then cp "${sigs[@]}" out/; fi
          echo "SixLauncher $(git rev-parse HEAD)" > out/SIXLAUNCHER_COMMIT.txt
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: sixlauncher-linux-x64
          path: out/
          if-no-files-found: error

  # SixLauncher for macOS on Apple Silicon: the window as SixLauncher.app in a .dmg, and the CLI.
  # There the title runs under a Wine with D3DMetal (CrossOver or Apple's Game Porting Toolkit),
  # with VIctory for macOS builds. Not signed or notarized with an Apple Developer ID: the first
  # open needs right-click > Open (or `xattr -dr com.apple.quarantine SixLauncher.app`).
  macos:
    name: SixLauncher (macOS)
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          perl -pi -e 's/^(  "version": )"[^"]*"/$1"$ENV{VERSION}"/' app/tauri.conf.json
          grep -n '"version"' app/tauri.conf.json

      - name: Updater public key
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$PUBKEY" ]; then
            jq --arg k "$PUBKEY" '.plugins.updater.pubkey = $k' app/tauri.conf.json > conf.tmp && mv conf.tmp app/tauri.conf.json
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tauri CLI
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri --version

      - name: Build the CLI
        run: cargo build --release --locked -p sixlauncher-cli

      # Only the .app from Tauri; the .dmg comes from hdiutil, which needs no Finder scripting
      # (Tauri's DMG layout script drives Finder, which a CI runner may refuse).
      - name: Build SixLauncher.app
        working-directory: app
        run: cargo tauri build --bundles app

      - name: Collect
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out dmg
          app=$(ls -d target/release/bundle/macos/*.app | head -1)
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname SixLauncher -srcfolder dmg -ov -format UDZO "out/SixLauncher_${VERSION}_aarch64.dmg"
          mkdir cli && cp target/release/sixlauncher cli/
          echo "SixLauncher $(git rev-parse HEAD)" > cli/BUILD.txt
          tar -czf "out/sixlauncher-macos-arm64.tar.gz" -C cli .
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: sixlauncher-macos-arm64
          path: out/
          if-no-files-found: error

  # SixLauncher for Windows x64: the window as an NSIS installer (per user, no administrator
  # rights; it fetches WebView2 if missing) and a .zip with the window and the CLI. On Windows the
  # backends' Windows builds (the same ones Proton and Wine run on Linux) run natively, with the
  # system's D3D12: the `native` runner, the only one there.
  windows:
    name: SixLauncher (Windows)
    needs: version
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s/^(  \"version\": )\"[^\"]*\"/\1\"$VERSION\"/" app/tauri.conf.json
          grep -n '"version"' app/tauri.conf.json

      # As in the Linux job: with the private key at hand the installer gets a .sig, and the
      # installed copy updates itself from latest.json (windows-x86_64-nsis).
      - name: Updater keys
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          conf=app/tauri.conf.json
          if [ -n "$PUBKEY" ]; then
            jq --arg k "$PUBKEY" '.plugins.updater.pubkey = $k' "$conf" > conf.tmp && mv conf.tmp "$conf"
            echo "updater public key replaced by the TAURI_UPDATER_PUBKEY variable"
          fi
          key=$(printf '%s' "$PRIVATE_KEY" | tr -d '[:space:]')
          if [ -z "$key" ]; then
            echo "::notice::no TAURI_SIGNING_PRIVATE_KEY secret: the installer is not signed for the updater"
          elif ! decoded=$(printf '%s' "$key" | base64 -d 2>/dev/null) || [ -z "$decoded" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not valid base64; the installer is built unsigned."
          else
            jq '.bundle.createUpdaterArtifacts = true' "$conf" > conf.tmp && mv conf.tmp "$conf"
            echo "::add-mask::$key"
            echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
            if [ -n "$PRIVATE_KEY_PASSWORD" ]; then
              {
                echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<SIXLAUNCHER_EOF"
                printf '%s\n' "$PRIVATE_KEY_PASSWORD"
                echo "SIXLAUNCHER_EOF"
              } >> "$GITHUB_ENV"
            fi
            echo "the installer will be signed"
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tauri CLI
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri --version

      - name: Build the CLI
        run: cargo build --release --locked -p sixlauncher-cli

      # The CLI starts on Windows and its checks see the native runner and the Windows folders.
      - name: Smoke test
        run: |
          set -uo pipefail
          # doctor exits non-zero here (no game is set up on the runner); only its output matters.
          out=$(./target/release/sixlauncher.exe doctor 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "Windows x86_64" || { echo "::error::doctor does not see Windows"; exit 1; }
          echo "$out" | grep -q "native" || { echo "::error::doctor does not use the native runner"; exit 1; }

      - name: Build the window and the installer
        working-directory: app
        run: cargo tauri build --bundles nsis

      - name: Collect
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out zip
          cp target/release/bundle/nsis/*-setup.exe out/
          shopt -s nullglob
          sigs=(target/release/bundle/nsis/*.sig)
          if [ ${#sigs[@]} -gt 0 ]; then cp "${sigs[@]}" out/; fi
          cp target/release/sixlauncher.exe target/release/sixlauncher-app.exe zip/
          {
            echo "SixLauncher $VERSION $(git rev-parse HEAD)"
            echo "Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sixlauncher-app.exe is the window (it needs Microsoft Edge WebView2, part of Windows 10 and 11);"
            echo "sixlauncher.exe is the command line. The installer (SixLauncher_*_x64-setup.exe) updates itself."
          } > zip/BUILD.txt
          (cd zip && 7z a -tzip "../out/sixlauncher-windows-x64.zip" . >/dev/null)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: sixlauncher-windows-x64
          path: out/
          if-no-files-found: error

  flatpak:
    name: SixLauncher (Flatpak)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Version ${{ needs.version.outputs.version }}
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s/^(  \"version\": )\"[^\"]*\"/\1\"$VERSION\"/" app/tauri.conf.json
          grep -n '"version"' app/tauri.conf.json

      # The Flatpak updates itself from a signed sixlauncher.flatpak (signed in the Release job)
      # and checks it with this key, the same one as the other packages'.
      - name: Updater public key
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # The key is base64 (no "|" or quotes), so sed can put it in place.
          if [ -n "$PUBKEY" ]; then
            sed -i -E "s|(\"pubkey\": )\"[^\"]*\"|\1\"$PUBKEY\"|" app/tauri.conf.json
            grep -n '"pubkey"' app/tauri.conf.json
          fi

      # The image ships the GNOME SDK in one of its read-only layers. When Flathub has a newer
      # build of it, flatpak-builder updates it in place, and renaming a directory that lives in
      # a lower overlayfs layer fails with EXDEV ("Failed to update org.gnome.Sdk: Invalid
      # cross-device link"); so the job passed or failed depending on Flathub's last publish.
      # A copy of the installation lives in the container's writable layer, where it can update.
      - name: Make the preinstalled Flatpak runtimes writable
        shell: bash
        run: |
          for dir in /var/lib/flatpak "$HOME/.local/share/flatpak"; do
            [ -d "$dir" ] || continue
            cp -a "$dir" "$dir.rw"
            rm -rf "$dir"
            mv "$dir.rw" "$dir"
            echo "copied $dir ($(du -sh "$dir" | cut -f1))"
          done

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: sixlauncher.flatpak
          manifest-path: packaging/flatpak/io.github.lportvi.sixlauncher.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: sixlauncher-flatpak
          path: sixlauncher.flatpak
          if-no-files-found: error

  bundle:
    name: Bundle
    needs: [launcher]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sixlauncher-linux-x64
          path: dl

      - name: Lay out the bundle
        run: |
          b=sixlauncher-linux-x64
          mkdir -p "$b"
          cp dl/sixlauncher dl/sixlauncher-app "$b/"
          chmod +x "$b/sixlauncher" "$b/sixlauncher-app"
          cp dl/SIXLAUNCHER_COMMIT.txt "$b/BUILD.txt"
          echo "Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$b/BUILD.txt"
          echo "VIctory and XCL: Compatibilidade > Procurar builds novas (built by SixLauncher/builder)" >> "$b/BUILD.txt"
          cat "$b/BUILD.txt"
          mkdir release
          tar -czf "release/$b.tar.gz" "$b"
          cp dl/*.deb dl/*.rpm dl/*.AppImage release/
          cp dl/*.sig release/ 2>/dev/null || echo "no updater signatures (unsigned build)"
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: sixlauncher-bundle
          path: release/
          if-no-files-found: error

  # One release per merge into main (and per `v*` tag), with every package: .deb, .rpm, AppImage,
  # Flatpak, the bundle, macOS's .dmg and Windows' installer and .zip. Only the newest version is
  # marked as the latest release, so two merges whose runs finish out of order keep it right.
  # It also carries latest.json, which the window reads from the latest release
  # (releases/latest/download/latest.json) to update itself: the version and, for each signed
  # package, its URL and signature under linux-x86_64-{appimage,deb,rpm,flatpak} and
  # windows-x86_64-nsis. The Flatpak bundle is signed here (the other packages are signed where
  # they are built), with the same key, by the Tauri CLI's `signer sign`.
  # On a pull request it runs as a dry run: it lists what it would publish and creates nothing.
  release:
    name: Release
    if: needs.version.outputs.release == 'true' || github.event_name == 'pull_request'
    needs: [version, bundle, flatpak, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sixlauncher-bundle
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: sixlauncher-flatpak
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: sixlauncher-macos-arm64
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: sixlauncher-windows-x64
          path: release

      - name: Sign the Flatpak for self-update
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key=$(printf '%s' "$PRIVATE_KEY" | tr -d '[:space:]')
          if [ -z "$key" ] || ! printf '%s' "$key" | base64 -d >/dev/null 2>&1; then
            echo "::notice::no valid TAURI_SIGNING_PRIVATE_KEY: the Flatpak is not signed and does not update itself"
            exit 0
          fi
          echo "::add-mask::$key"
          TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$PRIVATE_KEY_PASSWORD" \
            npx --yes @tauri-apps/cli@^2 signer sign release/sixlauncher.flatpak
          ls -l release/sixlauncher.flatpak.sig

      - name: latest.json (self-update manifest)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v$VERSION"
          platforms='{}'
          shopt -s nullglob
          for pair in 'linux-x86_64-appimage:*.AppImage' 'linux-x86_64-deb:*.deb' 'linux-x86_64-rpm:*.rpm' \
                      'linux-x86_64-flatpak:*.flatpak' 'windows-x86_64-nsis:*-setup.exe'; do
            key=${pair%%:*} pattern=${pair#*:}
            # shellcheck disable=SC2206 # the pattern is meant to expand
            files=(release/$pattern)
            [ ${#files[@]} -eq 1 ] || { echo "::warning::expected one $pattern, found ${#files[@]}"; continue; }
            f=${files[0]}
            if [ ! -f "$f.sig" ]; then echo "$(basename "$f"): not signed, no updater entry"; continue; fi
            platforms=$(jq --arg k "$key" --arg url "$base/$(basename "$f")" --rawfile sig "$f.sig" \
              '. + {($k): {url: $url, signature: $sig}}' <<<"$platforms")
          done
          jq -n --arg v "$VERSION" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            --arg notes "${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION" \
            '{version: $v, notes: $notes, pub_date: $at, platforms: $p}' > release/latest.json
          cat release/latest.json

      - name: Publish ${{ needs.version.outputs.release == 'true' && format('v{0}', needs.version.outputs.version) || '(dry run)' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH: ${{ needs.version.outputs.release }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          ls -l release
          # The newest x.y.z release so far (a `runtimes` prerelease is not one).
          newest=$(gh release list --limit 100 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease | not) | .tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          latest=true
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$tag" | sort -V | tail -n1)" != "$tag" ]; then
            latest=false
          fi
          echo "newest release so far: ${newest:-none}; $tag would be the latest: $latest"
          if [ "$PUBLISH" != true ]; then
            echo "Dry run (pull request): a merge publishes these files as v<major>.<minor>.<run number>."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists (a re-run): replacing its files"
            gh release upload "$tag" release/* --clobber
            exit 0
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "SixLauncher $tag" \
            --generate-notes --latest="$latest"
